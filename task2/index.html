<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2</title>
</head>
<body>

  <fieldset>
    <legend>User Information</legend>

    <form>
      <label for="username">Name:</label>
      <input type="text" id="username" name="username" pattern="[A-Za-z]{3,5}" title="3 to 5 letters only" required>
      <br><br>

      <label for="useremail">Email:</label>
      <input type="email" id="useremail" name="useremail" required>
      <br><br>

      <label for="pass">Password:</label>
      <input type="password" id="pass" name="pass" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}" required>
      <br><br>

      <label for="phone">Mobile:</label>
      <input type="tel" id="phone" name="phone" pattern="(010|011|015|012)[0-9]{8}" required>
      <br><br>

     
      <label for="city">Select City:</label>
      <input list="cities" id="city" name="city">
      <datalist id="cities">
        <option value="Cairo">
        <option value="Alexandria">
        <option value="Giza">
        <option value="Mansoura">
      </datalist>
      <br><br>

    
      <label for="val">Range:</label>
      <input type="range" id="val" name="val" min="300" max="500">
      <br><br>

   
      <label for="addr">Address:</label>
      <input type="text" id="addr" name="addr" pattern="[A-Za-z ]+" required>
      <br><br>

      
      <label for="img">Profile Image:</label>
      <input type="file" id="img" name="img" accept=".png">
      <br><br>

      <input type="submit" value="Submit">
    </form>
  </fieldset>

</body>
</html>
