<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Cards Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="bg-light padding-top-bottom">
        <div class="container">
            <div class="d-flex justify-between">
                
                <div class="card-transform">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=400" alt="Karan Singh">
                    <div class="card-info">
                        <h3>Karan Singh</h3>
                        <p>Graphic Designer</p>
                    </div>
                </div>

             
                <div class="card-transform">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=400" alt="Dolly Seth">
                    <div class="card-info">
                        <h3>Dolly Seth</h3>
                        <p>Digital Marketing</p>
                    </div>
                </div>

                
                <div class="card-transform">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=400" alt="Aakash Agrawal">
                    <div class="card-info">
                        <h3>Aakash Agrawal</h3>
                        <p>Chartered Accountant C.A</p>
                    </div>
                </div>

            </div>
        </div>
    </section>
</body>

</html>
